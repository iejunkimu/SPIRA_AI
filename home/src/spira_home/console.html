<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SPIRA Home · Operator</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#10161c;color:#e8eef5}body{max-width:1400px;margin:32px auto;padding:0 24px}h1{font-size:28px;margin-bottom:6px}p{color:#a8bacb}header{display:flex;justify-content:space-between;align-items:center}.badge{border:1px solid #427b68;border-radius:6px;padding:6px 10px;color:#90e3bf}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:#17212b;border:1px solid #2e4051;border-radius:10px;padding:18px;margin:18px 0}h2{font-size:17px;margin-top:0}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:440px;overflow:auto;color:#d6e3ed}button,input{font:inherit;padding:9px;border-radius:5px;border:1px solid #52697c;background:#233343;color:#eef4fa;margin:4px}button{cursor:pointer}button:hover{background:#304e64}.device{border-bottom:1px solid #344454;padding:10px 0}.name{font-weight:600;color:#94d6d4}.status{color:#a5cafa;font-size:12px}.warning{color:#ffd388}#error{color:#ffa2a2}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #344454;padding:8px;text-align:left}small{color:#9eafbd}@media(max-width:850px){main{display:block}header{display:block}}
</style>
<header><div><h1>SPIRA Home</h1><p>독립 관찰 · 실행 · 소유권 · 복구</p></div><span class="badge" id="mode">연결 확인 중</span></header>
<section><div id="clock"></div><p id="scope"></p><button onclick="control('pause')">일시정지</button><button onclick="control('resume')">재개</button><button onclick="control('stop_all')">모든 준비 중지·복구</button><span id="error"></span></section>
<section id="actors" hidden><h2>가상 세계의 독립 액터</h2><small>아래 조작은 실제 가전이 아닌 MQTT 가상 기기에만 전달됩니다. 시간 이동은 예약된 Home/기기 타이머를 차례로 방문합니다.</small><div><button onclick="emit('doorbell.pressed','doorbell_01')">초인종</button><button onclick="emit('doorlock.opened','doorlock_01')">현관 열림</button><button onclick="emit('doorlock.locked','doorlock_01')">현관 잠김</button><button onclick="jump(60)">+1분</button><button onclick="jump(1800)">+30분</button><button onclick="jump(86400)">+1일</button></div><div><input id="target" value="mqtt:light_living" aria-label="가상 기기"><input id="values" value='{"power":false}' aria-label="외부 변경 JSON"><button onclick="mutate()">가상 사용자 조작</button></div></section>
<main><div><section><h2>커넥터가 관찰한 현재 상태</h2><div id="devices"></div></section></div><div><section><h2>버전별 작업과 복구</h2><table><thead><tr><th>계획 / 작업</th><th>실행 사실</th><th>복구</th></tr></thead><tbody id="tasks"></tbody></table></section><section><h2>원본·판정 이벤트</h2><pre id="events"></pre></section></div></main>
<script>
let timestamp=0;
const el=id=>document.getElementById(id);
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error(await r.text());return r.json()}
function text(tag,value,cls){const n=document.createElement(tag);n.textContent=value;if(cls)n.className=cls;return n}
async function control(action){try{await api('/v1/control',{action});await refresh()}catch(e){el('error').textContent=e.message}}
async function emit(event_type,source){try{await api('/v1/test/world',{event_type,source,provenance:'USER'});await refresh()}catch(e){el('error').textContent=e.message}}
async function mutate(){try{await api('/v1/test/world',{target:el('target').value,values:JSON.parse(el('values').value),provenance:'USER'});await refresh()}catch(e){el('error').textContent=e.message}}
async function jump(delta){try{await api('/v1/test/clock',{timestamp:timestamp+delta});await refresh()}catch(e){el('error').textContent=e.message}}
async function refresh(){try{const [h,s,t,e]=await Promise.all([api('/health'),api('/v1/states'),api('/v1/tasks'),api('/v1/events?tail=true')]);timestamp=h.timestamp;el('clock').textContent=new Date(timestamp*1000).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' KST';el('mode').textContent=h.virtual_time?'VIRTUAL · 격리된 시나리오 시계':'LIVE CLOCK · 커넥터 관찰';el('scope').textContent='상태와 배지는 실제 응답을 표시합니다. VIRTUAL_MQTT와 LG 가정 기능은 물리 연동 증거가 아닙니다.';el('actors').hidden=!h.virtual_time;el('devices').replaceChildren();for(const d of s.observations){const card=text('div','','device');card.append(text('div',d.target,'name'),text('div',d.substrate+' · '+d.provenance+(d.assumption?' · '+d.assumption:''),'status'),text('pre',JSON.stringify(d.values,null,2)));el('devices').append(card)}for(const x of s.unavailable)el('devices').append(text('div',x.target+' · UNAVAILABLE','warning'));el('tasks').replaceChildren();for(const r of t.slice(-40).reverse()){const row=document.createElement('tr');row.append(text('td',r.body.plan_id+' / '+r.body.task_id),text('td',r.status+(r.result?.reason?' · '+r.result.reason:'')),text('td',r.restore_status||r.result?.restore_status||'—'));el('tasks').append(row)}el('events').textContent=e.slice(-20).reverse().map(x=>JSON.stringify(x.event)).join('\n\n');el('error').textContent=''}catch(e){el('error').textContent=e.message}}
refresh();setInterval(refresh,2000);
</script></html>
