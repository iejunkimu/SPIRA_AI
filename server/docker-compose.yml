services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: spira
      POSTGRES_PASSWORD: spira
      POSTGRES_DB: spira
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spira"]
      interval: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://spira:spira@db:5432/spira
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
